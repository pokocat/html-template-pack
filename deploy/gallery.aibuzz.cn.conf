# gallery.aibuzz.cn — HTML 幻灯片模板库静态站
# 静态文件根目录：/opt/gallery
# 证书复用通配符 *.aibuzz.cn

server {
    listen 80;
    server_name gallery.aibuzz.cn www.gallery.aibuzz.cn;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl;
    http2 on;
    server_name gallery.aibuzz.cn www.gallery.aibuzz.cn;

    ssl_certificate /etc/nginx/certs/aibuzz.cn/fullchain.pem;
    ssl_certificate_key /etc/nginx/certs/aibuzz.cn/privkey.key;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers HIGH:!aNULL:!MD5;
    ssl_prefer_server_ciphers on;
    add_header Strict-Transport-Security "max-age=31536000" always;

    root /opt/gallery;
    index gallery.html index.html;

    location / {
        try_files $uri $uri/ =404;
    }

    # 截图等静态资源缓存
    location ~* \.(png|jpg|jpeg|webp|svg|gif)$ {
        expires 7d;
        add_header Cache-Control "public";
    }

    # HTML/CSS/JS 不缓存，便于更新
    location ~* \.(html|css|js)$ {
        add_header Cache-Control "no-cache";
    }
}
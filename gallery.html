<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>PPT蒸馏器 · 蒸出你的下一场演示</title>
<style>
  :root {
    --bg: #F4F1EA;
    --card: #FFFFFF;
    --ink: #14110E;
    --muted: #7A7266;
    --line: #E5DFD3;
    --accent: #2E5EFF;
    --accent-ink: #FFFFFF;
    --radius: 16px;
    --shadow: 0 1px 2px rgba(20,17,14,.05), 0 8px 24px -12px rgba(20,17,14,.16);
    --shadow-lift: 0 2px 4px rgba(20,17,14,.06), 0 18px 40px -16px rgba(20,17,14,.28);
  }

  * { box-sizing: border-box; }

  html { -webkit-text-size-adjust: 100%; }

  body {
    margin: 0;
    background: var(--bg);
    color: var(--ink);
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", sans-serif;
    font-size: 15px;
    line-height: 1.6;
    -webkit-font-smoothing: antialiased;
    text-rendering: optimizeLegibility;
  }

  a { color: inherit; }

  /* ---------- header ---------- */
  .topbar {
    position: sticky;
    top: 0;
    z-index: 40;
    display: flex;
    align-items: center;
    gap: 16px;
    padding: 14px 28px;
    background: rgba(244,241,234,.82);
    backdrop-filter: saturate(160%) blur(12px);
    border-bottom: 1px solid var(--line);
  }
  .brand { display: flex; align-items: baseline; gap: 10px; }
  .brand .mark {
    font-weight: 800;
    letter-spacing: -.02em;
    font-size: 17px;
  }
  .brand .mark em { font-style: normal; color: var(--accent); }
  .brand .count {
    font-size: 12px;
    color: var(--muted);
    font-variant-numeric: tabular-nums;
  }
  .topbar .spacer { flex: 1; }

  .topic-wrap { display: flex; align-items: center; gap: 10px; }
  .topic-wrap label { font-size: 13px; color: var(--muted); white-space: nowrap; }
  .topic-input {
    width: clamp(220px, 30vw, 380px);
    padding: 9px 14px;
    font-size: 14px;
    color: var(--ink);
    background: var(--card);
    border: 1px solid var(--line);
    border-radius: 10px;
    outline: none;
    transition: border-color .15s ease, box-shadow .15s ease;
  }
  .topic-input:focus { border-color: var(--accent); box-shadow: 0 0 0 3px rgba(46,94,255,.12); }
  .topic-input::placeholder { color: #B6AE9F; }

  /* ---------- hero ---------- */
  .hero {
    padding: 72px 28px 40px;
    max-width: 1180px;
    margin: 0 auto;
  }
  .hero .kicker {
    font-size: 12px;
    font-weight: 700;
    letter-spacing: .14em;
    text-transform: uppercase;
    color: var(--accent);
    margin: 0 0 18px;
  }
  .hero h1 {
    font-size: clamp(34px, 5.4vw, 60px);
    line-height: 1.04;
    letter-spacing: -.03em;
    margin: 0 0 20px;
    font-weight: 800;
  }
  .hero h1 .accent { color: var(--accent); }
  .hero .sub {
    font-size: 17px;
    color: var(--muted);
    max-width: 640px;
    margin: 0 0 30px;
  }

  .steps {
    display: flex;
    gap: 14px;
    flex-wrap: wrap;
    margin: 0 -6px;
  }
  .step {
    flex: 1 1 200px;
    background: var(--card);
    border: 1px solid var(--line);
    border-radius: 14px;
    padding: 18px 18px;
  }
  .step .n {
    display: inline-flex;
    align-items: center;
    justify-content: center;
    width: 24px; height: 24px;
    border-radius: 7px;
    background: var(--accent);
    color: var(--accent-ink);
    font-size: 13px;
    font-weight: 700;
    margin-bottom: 10px;
  }
  .step .t { font-weight: 700; font-size: 15px; margin-bottom: 4px; }
  .step .d { font-size: 13px; color: var(--muted); }

  .quickbar {
    margin-top: 30px;
    background: var(--card);
    border: 1px solid var(--line);
    border-radius: 14px;
    padding: 4px 4px 4px 18px;
    display: flex; align-items: center; gap: 12px;
    max-width: 760px;
  }
  .quickbar .lbl { font-size: 13px; color: var(--muted); white-space: nowrap; }
  .quickbar input {
    flex: 1;
    border: none; outline: none;
    padding: 12px 0;
    font-size: 15px;
    background: transparent;
    color: var(--ink);
  }
  .quickbar input::placeholder { color: #B6AE9F; }

  /* ---------- toolbar ---------- */
  .toolbar {
    position: sticky;
    top: 52px;
    z-index: 30;
    display: flex;
    align-items: center;
    gap: 12px;
    flex-wrap: wrap;
    padding: 14px 28px;
    background: rgba(244,241,234,.82);
    backdrop-filter: saturate(160%) blur(12px);
    border-bottom: 1px solid var(--line);
  }
  .search {
    flex: 0 1 340px;
    padding: 9px 14px;
    font-size: 14px;
    border: 1px solid var(--line);
    border-radius: 10px;
    background: var(--card);
    outline: none;
    min-width: 0;
  }
  .search:focus { border-color: var(--accent); box-shadow: 0 0 0 3px rgba(46,94,255,.12); }
  .chips { display: flex; gap: 8px; flex-wrap: wrap; }
  .chip {
    padding: 7px 14px;
    font-size: 13px;
    border-radius: 999px;
    border: 1px solid var(--line);
    background: var(--card);
    color: var(--muted);
    cursor: pointer;
    transition: all .14s ease;
    font-weight: 500;
  }
  .chip:hover { border-color: #CFC7B8; color: var(--ink); }
  .chip.active { background: var(--ink); color: #fff; border-color: var(--ink); }
  .toolbar .hint { margin-left: auto; font-size: 13px; color: var(--muted); font-variant-numeric: tabular-nums; }

  /* ---------- grid ---------- */
  .wrap {
    max-width: 1180px;
    margin: 0 auto;
    padding: 28px 28px 96px;
  }
  .grid {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(340px, 1fr));
    gap: 22px;
  }
  .empty {
    grid-column: 1 / -1;
    text-align: center;
    color: var(--muted);
    padding: 80px 0;
    font-size: 15px;
  }

  .card {
    background: var(--card);
    border: 1px solid var(--line);
    border-radius: var(--radius);
    overflow: hidden;
    box-shadow: var(--shadow);
    cursor: pointer;
    transition: transform .18s ease, box-shadow .18s ease, border-color .18s ease;
    display: flex;
    flex-direction: column;
  }
  .card:hover {
    transform: translateY(-3px);
    box-shadow: var(--shadow-lift);
    border-color: #D7CFC0;
  }

  .thumbs {
    display: grid;
    grid-template-columns: 1fr 1fr 1fr;
    gap: 3px;
    padding: 10px 10px 0;
  }
  .thumb {
    position: relative;
    aspect-ratio: 16 / 10.5;
    background: #EFEBE2;
    border-radius: 8px;
    overflow: hidden;
  }
  .thumb img {
    width: 100%; height: 100%;
    object-fit: cover; object-position: top left;
    display: block;
    transition: transform .35s ease;
  }
  .card:hover .thumb img { transform: scale(1.04); }
  .thumb.fallback {
    display: flex; align-items: center; justify-content: center;
    text-align: center;
    background: radial-gradient(120% 120% at 50% 0%, #2b2f3a, #0d0f14);
    color: #F4F1EA;
    font-size: 12px;
    font-weight: 600;
    padding: 8px;
    letter-spacing: .02em;
  }
  .thumb.fallback span { opacity: .85; }

  .card-body { padding: 16px 16px 18px; display: flex; flex-direction: column; gap: 12px; flex: 1; }
  .card-top { display: flex; align-items: baseline; gap: 8px; flex-wrap: wrap; }
  .card-title { font-weight: 800; font-size: 17px; letter-spacing: -.01em; }
  .card-title .en { color: var(--muted); font-weight: 600; font-size: 13px; }
  .card-tagline { font-size: 13.5px; color: var(--muted); margin: 0; line-height: 1.55; }

  .tags { display: flex; flex-wrap: wrap; gap: 6px; }
  .tag {
    font-size: 11.5px;
    color: var(--ink);
    background: #F6F3EC;
    border: 1px solid var(--line);
    border-radius: 999px;
    padding: 3px 10px;
    font-weight: 500;
  }
  .tag.accent { background: rgba(46,94,255,.08); border-color: rgba(46,94,255,.22); color: #1E49D6; }

  .meta {
    display: flex; align-items: center; gap: 6px;
    flex-wrap: wrap;
    font-size: 11.5px;
    color: var(--muted);
    border-top: 1px dashed var(--line);
    padding-top: 12px;
    margin-top: auto;
  }
  .meta .pill {
    padding: 3px 9px;
    border-radius: 6px;
    background: #F2EFE8;
    font-weight: 600;
    font-variant-numeric: tabular-nums;
  }
  .card-actions { display: flex; gap: 10px; }
  .btn {
    flex: 1;
    display: inline-flex; align-items: center; justify-content: center; gap: 7px;
    padding: 10px 12px;
    font-size: 13.5px;
    font-weight: 700;
    border-radius: 10px;
    border: 1px solid transparent;
    cursor: pointer;
    transition: all .15s ease;
    font-family: inherit;
  }
  .btn.copy { background: var(--accent); color: var(--accent-ink); }
  .btn.copy:hover { background: #1E49E0; }
  .btn.copy:active { transform: scale(.985); }
  .btn.ghost { background: transparent; color: var(--ink); border-color: var(--line); }
  .btn.ghost:hover { border-color: #CFC7B8; background: #FBF9F5; }

  /* ---------- modal ---------- */
  .overlay {
    position: fixed; inset: 0;
    z-index: 60;
    background: rgba(20,17,14,.5);
    backdrop-filter: blur(4px);
    display: none;
    align-items: flex-start;
    justify-content: center;
    padding: 40px 20px;
    overflow-y: auto;
  }
  .overlay.open { display: flex; }
  .modal {
    background: var(--bg);
    border-radius: 20px;
    width: 100%;
    max-width: 860px;
    box-shadow: 0 30px 80px -20px rgba(20,17,14,.5);
    overflow: hidden;
    animation: pop .18s ease;
  }
  @keyframes pop { from { transform: translateY(10px); opacity: 0; } to { transform: none; opacity: 1; } }
  .modal-head {
    display: flex; align-items: flex-start; justify-content: space-between; gap: 16px;
    padding: 22px 26px 18px;
  }
  .modal-head h2 { margin: 0 0 6px; font-size: 24px; letter-spacing: -.02em; }
  .modal-head .en { font-weight: 600; color: var(--muted); font-size: 14px; }
  .modal-head .tagline { color: var(--muted); margin: 0; font-size: 14.5px; }
  .close {
    flex: 0 0 auto;
    width: 36px; height: 36px;
    border-radius: 10px;
    border: 1px solid var(--line);
    background: var(--card);
    color: var(--ink);
    font-size: 18px;
    cursor: pointer;
    line-height: 1;
    transition: all .15s ease;
  }
  .close:hover { background: #FBF9F5; border-color: #CFC7B8; }
  .modal-body { padding: 2px 26px 26px; }
  .modal-shots {
    display: grid;
    grid-template-columns: repeat(3, 1fr);
    gap: 10px;
    margin-bottom: 18px;
  }
  .modal-shots .shot {
    aspect-ratio: 16 / 10.5;
    border-radius: 10px;
    overflow: hidden;
    border: 1px solid var(--line);
    background: #EFEBE2;
  }
  .modal-shots .shot img { width: 100%; height: 100%; object-fit: cover; object-position: top left; display: block; }
  .modal-shots .shot.fallback {
    display: flex; align-items: center; justify-content: center;
    background: radial-gradient(120% 120% at 50% 0%, #2b2f3a, #0d0f14);
    color: #F4F1EA; font-size: 13px; font-weight: 600; text-align: center; padding: 12px;
  }
  .modal-block { margin-bottom: 16px; }
  .modal-block h4 {
    font-size: 12px; letter-spacing: .1em; text-transform: uppercase;
    color: var(--muted); margin: 0 0 8px; font-weight: 700;
  }
  .modal-block p { margin: 0; font-size: 14.5px; line-height: 1.7; }
  .modal-meta { display: flex; flex-wrap: wrap; gap: 8px; margin-bottom: 18px; }
  .modal-meta .pill {
    font-size: 12px; padding: 5px 12px; border-radius: 8px;
    background: var(--card); border: 1px solid var(--line); font-weight: 600;
  }

  .prompt-box {
    background: #14110E;
    border-radius: 12px;
    padding: 16px;
  }
  .prompt-box textarea {
    width: 100%;
    min-height: 200px;
    background: transparent;
    border: none;
    outline: none;
    resize: vertical;
    color: #EFEAE0;
    font-family: ui-monospace, "SF Mono", "JetBrains Mono", Menlo, Consolas, monospace;
    font-size: 12.5px;
    line-height: 1.7;
  }
  .prompt-actions { display: flex; justify-content: flex-end; gap: 10px; margin-top: 12px; }
  .btn.small { flex: 0 0 auto; padding: 9px 18px; font-size: 13px; }
  .prompt-box .btn.ghost {
    background: rgba(255,255,255,.08);
    border-color: rgba(255,255,255,.22);
    color: #EFEAE0;
  }
  .prompt-box .btn.ghost:hover {
    background: rgba(255,255,255,.16);
    border-color: rgba(255,255,255,.34);
  }

  /* ---------- toast ---------- */
  .toast {
    position: fixed;
    left: 50%; bottom: 28px;
    transform: translate(-50%, 20px);
    background: var(--ink);
    color: #fff;
    padding: 11px 20px;
    border-radius: 10px;
    font-size: 13.5px;
    font-weight: 600;
    opacity: 0;
    pointer-events: none;
    transition: all .25s ease;
    z-index: 80;
    box-shadow: 0 10px 30px -8px rgba(20,17,14,.4);
  }
  .toast.show { opacity: 1; transform: translate(-50%, 0); }

  @media (max-width: 680px) {
    .topbar { flex-wrap: wrap; padding: 12px 16px; }
    .hero { padding: 44px 16px 28px; }
    .toolbar { top: auto; padding: 12px 16px; }
    .wrap { padding: 18px 16px 72px; }
    .grid { grid-template-columns: 1fr; }
    .modal-shots { grid-template-columns: 1fr; }
  }
</style>
</head>
<body>

<header class="topbar">
  <div class="brand">
    <span class="mark">PPT<em>蒸馏器</em></span>
    <span class="count" id="headCount"></span>
  </div>
  <div class="spacer"></div>
  <div class="topic-wrap">
    <label for="topic">主题</label>
    <input id="topic" class="topic-input" placeholder="例如：AI 增长营销提案" />
  </div>
</header>

<section class="hero">
  <p class="kicker">现蒸 · 现用</p>
  <h1>挑一套模板，<span class="accent">蒸出</span>你的下一场演示</h1>
  <p class="sub">看中哪套就点进去，复制提示词丢给 Codex 或 Claude，坐等成品出锅。</p>

  <div class="steps">
    <div class="step">
      <div class="n">1</div>
      <div class="t">挑一锅原料</div>
      <div class="d">按配色、气质、正式度逛，点进卡片看全套版式。</div>
    </div>
    <div class="step">
      <div class="n">2</div>
      <div class="t">写下你的主题</div>
      <div class="d">在顶部填一句，越具体，蒸出来越对味。</div>
    </div>
    <div class="step">
      <div class="n">3</div>
      <div class="t">开蒸，丢给 AI</div>
      <div class="d">一键复制提示词，粘给 Codex 或 Claude。</div>
    </div>
  </div>

  <div class="quickbar">
    <span class="lbl">懒得想主题？先用这锅：</span>
    <input id="quick" readonly value="克隆 https://github.com/pokocat/html-template-pack，按 AGENTS.md 帮我做一份拿得出手的 HTML 幻灯片演示。" />
  </div>
</section>

<div class="toolbar">
  <input class="search" id="search" placeholder="想蒸什么味儿？搜模板名、气质、场景…" />
  <div class="chips" id="schemeChips">
    <button class="chip active" data-scheme="all">全部</button>
    <button class="chip" data-scheme="light">浅色</button>
    <button class="chip" data-scheme="dark">深色</button>
    <button class="chip" data-scheme="mixed">混合</button>
  </div>
  <span class="hint" id="hint"></span>
</div>

<main class="wrap">
  <div class="grid" id="grid"></div>
  <div class="empty" id="empty" style="display:none">锅都空了，换个词再蒸试试？</div>
</main>

<div class="overlay" id="overlay">
  <div class="modal" role="dialog" aria-modal="true">
    <div class="modal-head">
      <div>
        <h2 id="mTitle"></h2>
        <p class="en" id="mEn"></p>
        <p class="tagline" id="mTagline"></p>
      </div>
      <button class="close" id="mClose" aria-label="关闭">×</button>
    </div>
    <div class="modal-body">
      <div class="modal-shots" id="mShots"></div>
      <div class="modal-block">
        <h4>什么场面最对味</h4>
        <p id="mBest"></p>
      </div>
      <div class="modal-block">
        <h4>什么时候别用它</h4>
        <p id="mAvoid"></p>
      </div>
      <div class="modal-meta" id="mMeta"></div>
      <div class="prompt-box">
        <textarea id="mPrompt" readonly></textarea>
        <div class="prompt-actions">
          <button class="btn ghost small" id="mSelect">全选</button>
          <button class="btn copy small" id="mCopy">复制提示词</button>
        </div>
      </div>
    </div>
  </div>
</div>

<div class="toast" id="toast">提示词出锅啦</div>

ebas Neue + Caveat：一份孔版印刷杂志的 HTML 版。","mood":["手工","低保真","地下","温暖复古"],"occasion":["独立杂志 / 出版物","音乐 / 艺术品牌","创作者作品集","小批量 / 手工发布","文化 / 社群演示"],"tone":["糙","温暖","有意图","DIY"],"formality":"medium-low","density":"medium","scheme":"light","best_for":"适合一切印刷感、低保真、手工感的内容：独立杂志出版物、音乐／艺术品牌、创作者作品集、小批量手工发布、社群演示。也是想要孔版印刷温暖而非数码精致感的科技、调研、商业演示的黑马之选。","avoid_for":"要求数码原生精致或科技快手节奏的场合不适合——层叠杂志美学刻意做得手作。","slide_count":10,"shots":["retro-zine-1.png?v=1781049576","retro-zine-4.png?v=1781049576","retro-zine-8.png?v=1781049576"]},{"slug":"sakura-chroma","name":"樱花色谱","tagline":"复古日式卡带包装美学：米纸、斜向彩虹带、窄粗标题字、JIS 规格复选框。","mood":["复古","俏皮","卡哇伊科技","温暖","有触感","产品目录"],"occasion":["产品发布 / 目录","独立硬件 / 模拟工作室品牌","音乐厂牌 / 发片排期","创意工作室年报","杂志 / 杂志提案","复古风品牌活动"],"tone":["俏皮","自信","温暖","有触感","80 年代日式科技"],"formality":"low","density":"medium","scheme":"light","best_for":"适合一切该像复古日式卡带包装或 TDK／Sony／樱花牌产品目录的内容：独立硬件品牌演示、音乐厂牌发片排期、模拟工作室回顾、杂志提案、卡哇伊科技产品发布、创意工作室年报。也适合任何想要大胆配色、窄展示字和有触感印刷产品感的设计。","avoid_for":"需要克制、企业或安静排版的演示不适合——粗窄标题组合、彩带条纹和原色配色刻意做得响亮、产品页。","slide_count":8,"shots":["sakura-chroma-1.png?v=1781049576","sakura-chroma-3.png?v=1781049576","sakura-chroma-4.png?v=1781049576"]},{"slug":"scatterbrain","name":"便签墙","tagline":"便利贴灵感：粉彩便签、Caveat 手写、Shrikhand 和 Zilla Slab 字形栈。","mood":["俏皮","创意","温暖","故意凌乱","工作坊"],"occasion":["头脑风暴","工作坊","创意公司资质","设计思维工作坊","构思提案","美术指导评审"],"tone":["随性","温暖","有表现力","有人味"],"formality":"low","density":"high","scheme":"light","best_for":"适合一切该像设计师白板的内容：头脑风暴、工作坊、创意公司资质、设计思维工作坊、构思提案、美术指导评审。也适合任何想读起来像进行中的思考、而非打磨好结论的演示（含科技、调研、商业）。","avoid_for":"要求精确和机构分量的场合不适合——便利贴美学刻意读起来温暖又未完成。","slide_count":10,"shots":["scatterbrain-1.png?v=1781049576","scatterbrain-4.png?v=1781049576","scatterbrain-8.png?v=1781049576"]}]};
const REPO = DATA.repo;

const FORMALITY = { low: "休闲", "medium-low": "偏休闲", medium: "中等", "medium-high": "偏正式", high: "正式" };
const DENSITY = { low: "低密度", "medium-low": "偏低", medium: "中密度", "medium-high": "偏高", high: "高密度" };
const SCHEME = { light: "浅色", dark: "深色", mixed: "混合" };

const $ = (s, r=document) => r.querySelector(s);
const $$ = (s, r=document) => Array.from(r.querySelectorAll(s));

let state = { q: "", scheme: "all" };

function buildPrompt(t, topic) {
  const tlen = topic.trim();
  const subject = tlen ? tlen : "（在这里写你的主题）";
  return [
    `用 PPT蒸馏器里的「${t.name}」模板，帮我蒸一份 HTML 幻灯片演示。`,
    ``,
    `主题：${subject}`,
    ``,
    `写法：`,
    `1. 克隆 ${REPO}，读根目录的 AGENTS.md（操作手册）`,
    `2. 直接用 templates/${t.slug}/ 这套模板（已经选定，不用再比选）`,
    `3. 按 AGENTS.md 第 3 节，用我的主题和内容替换模板里的占位文字`,
    `4. 输出完整的最终 HTML 文件，并在浏览器打开`
  ].join("\n");
}

function shotsOf(t) {
  return (t.shots || []).map(f => "screenshots/" + f);
}

function esc(s) {
  return String(s ?? "").replace(/[&<>"']/g, c => ({ "&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;" }[c]));
}

function tagChips(t, n=4) {
  return t.slice(0, n).map(x => `<span class="tag">${esc(x)}</span>`).join("");
}

function cardHtml(t) {
  const shots = shotsOf(t);
  const thumbs = shots.length
    ? shots.slice(0,3).map((s,i) => `<div class="thumb"><img src="${s}" alt="${esc(t.name)} 截图 ${i+1}" loading="lazy" /></div>`).join("")
    : `<div class="thumb fallback"><span>${esc(t.name)}<br />截图待补</span></div>`;
  const mood = tagChips(t.mood, 3);
  const tone = tagChips(t.tone, 2);
  const meta = [
    `<span class="pill">${FORMALITY[t.formality] || t.formality || "—"}</span>`,
    `<span class="pill">${DENSITY[t.density] || t.density || "—"}</span>`,
    `<span class="pill">${SCHEME[t.scheme] || t.scheme || "—"}</span>`,
    `<span class="pill">${t.slide_count || "—"} 页</span>`
  ].join("");
  return `
    <article class="card" data-slug="${esc(t.slug)}">
      <div class="thumbs">${thumbs}</div>
      <div class="card-body">
        <div class="card-top">
          <span class="card-title">${esc(t.name)}</span>
          <span class="en">${esc(t.slug)}</span>
        </div>
        <p class="card-tagline">${esc(t.tagline)}</p>
        <div class="tags">${mood}${tone}</div>
        <div class="meta">${meta}</div>
        <div class="card-actions">
          <button class="btn copy" data-copy="${esc(t.slug)}">复制提示词</button>
          <button class="btn ghost" data-view="${esc(t.slug)}">详情</button>
        </div>
      </div>
    </article>`;
}

function render() {
  const list = DATA.templates.filter(t => {
    if (state.scheme !== "all" && t.scheme !== state.scheme) return false;
    if (state.q) {
      const hay = [t.name, t.slug, t.tagline, ...(t.mood||[]), ...(t.tone||[]), ...(t.occasion||[])].join(" ").toLowerCase();
      if (!hay.includes(state.q.toLowerCase())) return false;
    }
    return true;
  });
  const grid = $("#grid");
  grid.innerHTML = list.map(cardHtml).join("");
  $("#empty").style.display = list.length ? "none" : "block";
  $("#hint").textContent = `共 ${list.length} 套`;
  $("#headCount").textContent = `· 炉上 ${DATA.templates.length} 锅`;
}

/* --- copy helpers --- */
function copyText(text, cb) {
  const done = ok => { toast(ok ? "提示词出锅啦，去 AI 里开蒸" : "复制失败，请手动选择"); cb && cb(); };
  if (navigator.clipboard && navigator.clipboard.writeText) {
    navigator.clipboard.writeText(text).then(() => done(true), () => fallbackCopy(text, done));
  } else {
    fallbackCopy(text, done);
  }
}
function fallbackCopy(text, done) {
  const ta = document.createElement("textarea");
  ta.value = text;
  ta.style.position = "fixed"; ta.style.opacity = "0";
  document.body.appendChild(ta);
  ta.focus(); ta.select();
  let ok = false;
  try { ok = document.execCommand("copy"); } catch(e) {}
  document.body.removeChild(ta);
  done(ok);
}

let toastTimer;
function toast(msg) {
  const el = $("#toast");
  el.textContent = msg;
  el.classList.add("show");
  clearTimeout(toastTimer);
  toastTimer = setTimeout(() => el.classList.remove("show"), 1800);
}

/* --- modal --- */
let current = null;
function openModal(slug) {
  const t = DATA.templates.find(x => x.slug === slug);
  if (!t) return;
  current = t;
  $("#mTitle").textContent = t.name;
  $("#mEn").textContent = t.slug;
  $("#mTagline").textContent = t.tagline;
  $("#mBest").textContent = t.best_for || "";
  $("#mAvoid").textContent = t.avoid_for || "";

  const shots = shotsOf(t);
  $("#mShots").innerHTML = shots.length
    ? shots.map(s => `<div class="shot"><img src="${s}" alt="" /></div>`).join("")
    : `<div class="shot fallback">${esc(t.name)}<br />截图待补</div>`;

  $("#mMeta").innerHTML = [
    `${FORMALITY[t.formality] || t.formality || "—"}`,
    `${DENSITY[t.density] || t.density || "—"}`,
    `${SCHEME[t.scheme] || t.scheme || "—"}`,
    `${t.slide_count || "—"} 页`
  ].map(x => `<span class="pill">${x}</span>`).join("");

  refreshPrompt();
  $("#overlay").classList.add("open");
  document.body.style.overflow = "hidden";
}
function closeModal() {
  $("#overlay").classList.remove("open");
  document.body.style.overflow = "";
  current = null;
}
function refreshPrompt() {
  if (current) $("#mPrompt").value = buildPrompt(current, $("#topic").value);
}

/* --- events --- */
$("#grid").addEventListener("click", e => {
  const card = e.target.closest(".card");
  if (!card) return;
  const slug = card.dataset.slug;
  const copyBtn = e.target.closest("[data-copy]");
  const viewBtn = e.target.closest("[data-view]");
  if (copyBtn) {
    const t = DATA.templates.find(x => x.slug === slug);
    copyText(buildPrompt(t, $("#topic").value));
    return;
  }
  if (viewBtn) { openModal(slug); return; }
  openModal(slug);
});

$("#mCopy").addEventListener("click", () => copyText($("#mPrompt").value));
$("#mSelect").addEventListener("click", () => { $("#mPrompt").focus(); $("#mPrompt").select(); });
$("#mClose").addEventListener("click", closeModal);
$("#overlay").addEventListener("click", e => { if (e.target === $("#overlay")) closeModal(); });
document.addEventListener("keydown", e => { if (e.key === "Escape") closeModal(); });

$("#topic").addEventListener("input", refreshPrompt);

$("#search").addEventListener("input", e => { state.q = e.target.value.trim(); render(); });

$("#schemeChips").addEventListener("click", e => {
  const chip = e.target.closest(".chip");
  if (!chip) return;
  $$(".chip", $("#schemeChips")).forEach(c => c.classList.remove("active"));
  chip.classList.add("active");
  state.scheme = chip.dataset.scheme;
  render();
});

render();
</script>
</body>
